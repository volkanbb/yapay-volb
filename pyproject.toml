[project]
name = "yapay-volb"
version = "0.1.0"
description = "YAPAY VOLB — personal AI desktop assistant with an animated hoodie-wearing duck"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.6",
    "psutil>=5.9",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "playwright>=1.45",
]

[project.optional-dependencies]
edge = ["edge-tts>=6.1"]
semantic = ["chromadb>=0.5"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.scripts]
yapay-volb = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
